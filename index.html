
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ff1493">
  <title>KALYUG LIVE</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --pink: #ff1493;
      --black: #050505;
      --white: #ffffff;
      --yellow: #ffe600;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    html {
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      background: var(--pink);
      overscroll-behavior: none;
      touch-action: pan-y;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      background: var(--pink);
      color: var(--black);
      font-family: "Space Grotesk", sans-serif;
      overscroll-behavior: none;
      touch-action: pan-y;
      user-select: none;
      -webkit-user-select: none;
    }

    button {
      font: inherit;
      touch-action: manipulation;
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(22px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .topbar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      font-family: "Bangers", cursive;
      font-size: 27px;
      letter-spacing: 1.5px;
      line-height: 1;
      color: var(--black);
      -webkit-text-stroke: 1px var(--white);
      text-shadow: 2px 2px 0 var(--white);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--black);
      color: var(--white);
      border: 2px solid var(--white);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff3030;
      box-shadow: 0 0 8px #ff3030;
    }

    .hero {
      width: 100%;
      text-align: center;
      padding-top: 2px;
    }

    .hero h1 {
      margin: 0;
      font-family: "Bangers", cursive;
      font-size: clamp(64px, 15vw, 112px);
      line-height: 0.9;
      letter-spacing: 2px;
      color: var(--black);
      -webkit-text-stroke: 2px var(--white);
      text-shadow: 5px 5px 0 var(--white), 8px 8px 0 var(--black);
      overflow-wrap: anywhere;
    }

    .tagline {
      margin: 16px 0 0;
      font-family: "Permanent Marker", cursive;
      font-size: clamp(15px, 4vw, 23px);
      line-height: 1.35;
      color: var(--black);
      -webkit-text-stroke: 0.35px var(--white);
      text-shadow: 1px 1px 0 var(--white);
    }

    .tagline .bang {
      color: var(--yellow);
      -webkit-text-stroke: 1px var(--black);
      text-shadow: 2px 2px 0 var(--black);
    }

    .status {
      max-width: 100%;
      min-height: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 14px;
      border: 2px solid var(--black);
      border-radius: 7px;
      background: var(--white);
      color: var(--black);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      box-shadow: 4px 4px 0 var(--black);
    }

    .video-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .video-card {
      min-width: 0;
      overflow: hidden;
      background: var(--black);
      border: 3px solid var(--black);
      border-radius: 12px;
      box-shadow: 5px 5px 0 var(--white);
    }

    .video-heading {
      min-height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 4px;
      background: var(--yellow);
      color: var(--black);
      font-family: "Bangers", cursive;
      font-size: clamp(16px, 4vw, 23px);
      letter-spacing: 1px;
      text-align: center;
    }

    .video-stage {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      background: #151515;
    }

    .video-stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #151515;
    }

    .video-stage video[hidden] {
      display: none !important;
    }

    .video-label {
      position: absolute;
      left: 8px;
      bottom: 8px;
      z-index: 2;
      padding: 5px 8px;
      background: var(--pink);
      border: 1px solid var(--white);
      color: var(--black);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .video-label.remote-label {
      background: var(--yellow);
    }

    .controls {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .control-btn {
      min-height: 52px;
      padding: 12px 10px;
      border: 3px solid var(--black);
      border-radius: 8px;
      background: var(--white);
      color: var(--black);
      font-family: "Bangers", cursive;
      font-size: clamp(17px, 4.5vw, 23px);
      letter-spacing: 1px;
      box-shadow: 4px 4px 0 var(--black);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    .control-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 1px 1px 0 var(--black);
    }

    .control-btn.primary {
      background: var(--yellow);
    }

    .control-btn.dark {
      background: var(--black);
      color: var(--white);
      border-color: var(--white);
      box-shadow: 4px 4px 0 var(--white);
    }

    .control-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .footer {
      width: 100%;
      margin-top: auto;
      padding-top: 8px;
      text-align: center;
      font-family: "Permanent Marker", cursive;
      font-size: 13px;
      line-height: 1.5;
      color: var(--black);
      text-shadow: 1px 1px 0 var(--white);
    }

    .small-note {
      margin: 5px 0 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    @media (min-width: 650px) {
      .app {
        gap: 22px;
        padding-left: 24px;
        padding-right: 24px;
      }

      .video-grid {
        gap: 20px;
      }

      .video-stage {
        aspect-ratio: 4 / 3;
      }

      .controls {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 360px) {
      .app {
        padding-left: 12px;
        padding-right: 12px;
        gap: 15px;
      }

      .brand {
        font-size: 23px;
      }

      .video-grid {
        gap: 9px;
      }

      .video-heading {
        font-size: 15px;
      }

      .control-btn {
        font-size: 17px;
        padding: 10px 6px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">KALYUG LIVE</div>
      <div class="live-badge">
        <span class="live-dot"></span>
        LIVE CHAT
      </div>
    </header>

    <section class="hero">
      <h1>KALYUG<br>LIVE</h1>
      <p class="tagline"><span class="bang">KALYUG !</span> Only God Can Be the Godfather</p>
    </section>

    <div class="status" id="status" role="status" aria-live="polite">
      READY TO CONNECT
    </div>

    <section class="video-grid" aria-label="Video chat">
      <article class="video-card">
        <div class="video-heading">YOUR SIDE</div>
        <div class="video-stage">
          <video id="localVideo" autoplay playsinline muted hidden></video>
          <span class="video-label">YOU</span>
        </div>
      </article>

      <article class="video-card">
        <div class="video-heading">THE UNKNOWN</div>
        <div class="video-stage">
          <video id="remoteVideo" autoplay playsinline hidden></video>
          <span class="video-label remote-label">STRANGER</span>
        </div>
      </article>
    </section>

    <section class="controls" aria-label="Call controls">
      <button class="control-btn primary" id="startBtn" type="button">START CAM</button>
      <button class="control-btn" id="micBtn" type="button" disabled>MIC ON</button>
      <button class="control-btn dark" id="nextBtn" type="button" disabled>NEXT</button>
      <button class="control-btn" id="stopBtn" type="button" disabled>STOP</button>
    </section>

    <footer class="footer">
      KALYUG LIVE
      <p class="small-note">CONNECT WITH THE UNKNOWN</p>
    </footer>
  </main>

  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

  <script>
    const BACKEND_URL = "https://kalyug-live-1.onrender.com";

    const statusEl = document.getElementById("status");
    const localVideo = document.getElementById("localVideo");
    const remoteVideo = document.getElementById("remoteVideo");
    const startBtn = document.getElementById("startBtn");
    const micBtn = document.getElementById("micBtn");
    const nextBtn = document.getElementById("nextBtn");
    const stopBtn = document.getElementById("stopBtn");

    let socket = null;
    let localStream = null;
    let peerConnection = null;
    let partnerId = null;
    let micEnabled = true;
    let matchRequested = false;
    let pendingCandidates = [];

    const rtcConfig = {
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ]
    };

    function setStatus(message) {
      statusEl.textContent = message;
    }

    function requestMatch() {
      if (!localStream || !socket?.connected || matchRequested) return;

      closePeerConnection();
      partnerId = null;
      matchRequested = true;
      setStatus("FINDING A STRANGER...");
      socket.emit("find_partner");
    }

    function connectSocket() {
      if (socket) {
        if (socket.connected) requestMatch();
        return;
      }

      if (typeof io === "undefined") {
        setStatus("CONNECTION LIBRARY FAILED");
        return;
      }

      socket = io(BACKEND_URL, {
        transports: ["websocket", "polling"],
        reconnection: true
      });

      socket.on("connect", () => {
        if (localStream) {
          requestMatch();
        } else {
          setStatus("SERVER CONNECTED");
        }
      });

      socket.on("connect_error", (error) => {
        console.error("Socket connection error:", error);
        setStatus("SERVER CONNECTION ERROR");
      });

      socket.on("waiting", () => {
        matchRequested = true;
        partnerId = null;
        setStatus("WAITING FOR A STRANGER...");
      });

      socket.on("matched", async (data) => {
        partnerId = typeof data === "string"
          ? data
          : data?.partnerId || data?.id || data?.socketId || null;

        matchRequested = false;

        if (!partnerId || !localStream) {
          console.error("Matched event did not include a usable partner ID:", data);
          setStatus("MATCH DATA ERROR");
          return;
        }

        setStatus("STRANGER FOUND — CONNECTING...");
        await createPeerConnection();

        if (socket.id < partnerId) {
          try {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit("webrtc_offer", {
              to: partnerId,
              offer: peerConnection.localDescription
            });
          } catch (error) {
            console.error("Offer error:", error);
            setStatus("CALL SETUP FAILED");
          }
        }
      });

      socket.on("webrtc_offer", async (data) => {
        try {
          const from = data?.from || data?.sender;
          const offer = data?.offer || data?.description;

          if (from) partnerId = from;
          if (!offer || !localStream) return;

          await createPeerConnection();

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(offer)
          );

          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);

          socket.emit("webrtc_answer", {
            to: partnerId,
            answer: peerConnection.localDescription
          });

          await flushCandidates();
        } catch (error) {
          console.error("Offer handling error:", error);
          setStatus("CALL SETUP FAILED");
        }
      });

      socket.on("webrtc_answer", async (data) => {
        try {
          const answer = data?.answer || data?.description;
          if (!answer || !peerConnection) return;

          await peerConnection.setRemoteDescription(
            new RTCSessionDescription(answer)
          );

          await flushCandidates();
        } catch (error) {
          console.error("Answer handling error:", error);
        }
      });

      socket.on("webrtc_ice_candidate", async (data) => {
        try {
          const candidate = data?.candidate;
          if (!candidate) return;

          if (!peerConnection || !peerConnection.remoteDescription) {
            pendingCandidates.push(candidate);
          } else {
            await peerConnection.addIceCandidate(
              new RTCIceCandidate(candidate)
            );
          }
        } catch (error) {
          console.error("ICE candidate error:", error);
        }
      });

      socket.on("partner_disconnected", () => {
        closePeerConnection();
        partnerId = null;
        matchRequested = false;
        setStatus("STRANGER DISCONNECTED");
      });

      socket.on("disconnect", () => {
        matchRequested = false;
        setStatus("SERVER DISCONNECTED");
      });
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("OPEN THIS WEBSITE USING HTTPS");
          return;
        }

        setStatus("REQUESTING CAMERA...");

        localStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: true
        });

        localVideo.srcObject = localStream;
        localVideo.hidden = false;
        await localVideo.play().catch(() => {});

        micEnabled = true;
        micBtn.textContent = "MIC ON";
        micBtn.disabled = false;
        nextBtn.disabled = false;
        stopBtn.disabled = false;
        startBtn.disabled = true;

        connectSocket();

        // Start matchmaking immediately if the socket is already connected.
        if (socket?.connected) {
          requestMatch();
        } else {
          setStatus("CONNECTING TO SERVER...");
        }
      } catch (error) {
        console.error("Camera error:", error);
        setStatus("CAMERA / MIC PERMISSION DENIED");
      }
    }

    async function createPeerConnection() {
      if (peerConnection) return;

      peerConnection = new RTCPeerConnection(rtcConfig);

      localStream.getTracks().forEach((track) => {
        peerConnection.addTrack(track, localStream);
      });

      peerConnection.ontrack = (event) => {
        const stream = event.streams?.[0];
        if (!stream) return;

        remoteVideo.srcObject = stream;
        remoteVideo.hidden = false;
        remoteVideo.play().catch(() => {});
        setStatus("YOU ARE CONNECTED");
      };

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && partnerId && socket?.connected) {
          socket.emit("webrtc_ice_candidate", {
            to: partnerId,
            candidate: event.candidate
          });
        }
      };

      peerConnection.onconnectionstatechange = () => {
        if (!peerConnection) return;

        const state = peerConnection.connectionState;

        if (state === "connected") {
          setStatus("YOU ARE CONNECTED");
        } else if (state === "failed") {
          setStatus("CONNECTION FAILED — TRY NEXT");
        } else if (state === "disconnected") {
          setStatus("CONNECTION INTERRUPTED");
        }
      };
    }

    async function flushCandidates() {
      if (!peerConnection?.remoteDescription) return;

      const queued = [...pendingCandidates];
      pendingCandidates = [];

      for (const candidate of queued) {
        try {
          await peerConnection.addIceCandidate(
            new RTCIceCandidate(candidate)
          );
        } catch (error) {
          console.error("Queued ICE candidate error:", error);
        }
      }
    }

    function closePeerConnection() {
      if (peerConnection) {
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.close();
        peerConnection = null;
      }

      remoteVideo.srcObject = null;
      remoteVideo.hidden = true;
      pendingCandidates = [];
    }

    function nextPartner() {
      if (!localStream || !socket?.connected) return;

      closePeerConnection();
      partnerId = null;
      matchRequested = false;

      socket.emit("next_partner");
      requestMatch();
    }

    function stopCamera() {
      closePeerConnection();

      if (localStream) {
        localStream.getTracks().forEach((track) => track.stop());
        localStream = null;
      }

      localVideo.srcObject = null;
      localVideo.hidden = true;

      if (socket) {
        socket.disconnect();
        socket = null;
      }

      partnerId = null;
      matchRequested = false;
      micEnabled = true;

      startBtn.disabled = false;
      micBtn.disabled = true;
      nextBtn.disabled = true;
      stopBtn.disabled = true;
      micBtn.textContent = "MIC ON";

      setStatus("READY TO CONNECT");
    }

    function toggleMic() {
      if (!localStream) return;

      micEnabled = !micEnabled;

      localStream.getAudioTracks().forEach((track) => {
        track.enabled = micEnabled;
      });

      micBtn.textContent = micEnabled ? "MIC ON" : "MIC OFF";
      setStatus(micEnabled ? "MICROPHONE ON" : "MICROPHONE OFF");
    }

    startBtn.addEventListener("click", startCamera);
    micBtn.addEventListener("click", toggleMic);
    nextBtn.addEventListener("click", nextPartner);
    stopBtn.addEventListener("click", stopCamera);

    // Best-effort pinch-zoom prevention on touch devices.
    document.addEventListener("touchmove", (event) => {
      if (event.touches && event.touches.length > 1) {
        event.preventDefault();
      }
    }, { passive: false });

    // Best-effort double-tap zoom prevention.
    let lastTouchEnd = 0;

    document.addEventListener("touchend", (event) => {
      const now = Date.now();

      if (now - lastTouchEnd <= 300) {
        event.preventDefault();
      }

      lastTouchEnd = now;
    }, { passive: false });

    // Prevent Safari gesture zoom where supported.
    ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
      document.addEventListener(type, (event) => {
        event.preventDefault();
      }, { passive: false });
    });

    connectSocket();
  </script>
</body>
</html>
